# The vendored client and contract, held to their commit and to sdk-python's main. The comparison is spec's shared `upstream-drift` (Q-R68,
# Q-R70), which writes what it found and the command that takes it to the run's
# summary as well as the log.
name: sdk-drift
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, as the floor: a pull request is what usually asks the question.
    - cron: "50 7 * * 1"
permissions:
  contents: read
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  sdk-drift:
    uses: lemonfiber/spec/.github/workflows/upstream-drift.yml@f19777c73feb01457787e5c4dd92eee17bc1feda # v1.0.116
    with:
      lock: "vendored"
      upstream: "sdk-python"
      revision: "src/lemonfiber_mcp/_vendor/lemonfiber/REVISION"
      copies: |
        src/lemonfiber:src/lemonfiber_mcp/_vendor/lemonfiber
        contract:contract
      remedy: "run `python3 scripts/vendor_sdk.py take {head}`, then `just generate`, and commit the result"
