# Calls the reusable workflows defined once in lemonfiber/spec (Q-R56). The
# repository holds no code yet, so the shared gates are all it runs.
name: ci
on: [pull_request]
permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A job-level block replaces the workflow-level default
  # outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@eaedb9b9ddd3c3208f4fbe898718d19e45e04d74 # v1.0.49
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@67242eb72bafaa25b3bb735ff3f5c3a50e0006d6 # v1.0.52
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@eaedb9b9ddd3c3208f4fbe898718d19e45e04d74 # v1.0.49
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@eaedb9b9ddd3c3208f4fbe898718d19e45e04d74 # v1.0.49
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@eaedb9b9ddd3c3208f4fbe898718d19e45e04d74 # v1.0.49
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@eaedb9b9ddd3c3208f4fbe898718d19e45e04d74 # v1.0.49
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@eaedb9b9ddd3c3208f4fbe898718d19e45e04d74 # v1.0.49
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@eaedb9b9ddd3c3208f4fbe898718d19e45e04d74 # v1.0.49
