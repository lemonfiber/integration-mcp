# The shared gates, defined once in lemonfiber/spec (Q-R56), and the server's
# own: formatting, lint, strict types, the generated tools, the suite with full
# coverage, and mutation.
name: ci
on: [pull_request]
permissions:
  contents: read

# The environment is installed from the lockfile and nothing else, building no
# source distribution, and no `uv` a recipe runs syncs it again.
env:
  UV_LOCKED: "1"
  UV_NO_BUILD: "1"
  UV_NO_SYNC: "1"

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Which of the server's gates are worth running at all. A documentation change
  # starts no Python toolchain, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # No base to compare against means every gate runs.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit, so every gate runs."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          # Anything that is not documentation is code, so a new kind of file
          # runs the gates. Under `.github/`, only this file runs them, and a
          # change to it runs none where every changed line is a pin on a
          # shared workflow from `lemonfiber/spec`: those jobs run no Python.
          code=false
          while IFS= read -r path; do
            case "${path}" in
            '' | *.md | LICENSE) ;;
            .github/workflows/ci.yml)
              # Captured and tested for emptiness rather than piped to
              # `grep -q`, which stops at the first line and lets `pipefail`
              # read the writers' SIGPIPE as no such line.
              moved="$(git diff -U0 "${BASE}" HEAD -- "${path}" \
                | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
                | grep -vE '^[-+][[:space:]]*uses: lemonfiber/spec/\.github/workflows/[^@]+@[0-9a-f]{40}( # .*)?$' || true)"
              if [ -n "${moved}" ]; then
                code=true
              fi
              ;;
            .github/*) ;;
            *) code=true ;;
            esac
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Documentation, and workflows that run no Python gate; the Python gates are skipped."
          fi

  # Formatting, every lint rule, strict types, and the tools against the
  # contract they are generated from. One checkout, one environment, cheapest
  # first.
  checks:
    name: checks
    needs: scope
    # The result is asked as well as the output: a `scope` that failed leaves no
    # output, and no output is not a "no".
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install exactly what the lockfile says
        run: uv sync --locked --no-build
      - name: Formatting and lint
        run: uv run --locked --no-build --no-sync just lint
      - name: Strict types
        run: uv run --locked --no-build --no-sync just types
      - name: The tools are what the vendored contract generates
        run: uv run --locked --no-build --no-sync just generated

  tests:
    name: tests and coverage
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install exactly what the lockfile says
        run: uv sync --locked --no-build
      - name: The suite, with 100% line and branch coverage
        run: uv run --locked --no-build --no-sync just coverage

  # The most expensive gate, so the most guarded: only on a pull request, and
  # only once the tests have passed. Mutating code whose tests already fail
  # measures nothing. The modules are split across shards that run at once, each
  # held to the minimum score.
  mutation-shards:
    name: mutation (${{ matrix.shard }})
    needs: [scope, tests]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: The tests passed, so there is something to measure
        env:
          TESTS: ${{ needs.tests.result }}
        run: |
          if [ "${TESTS}" != success ]; then
            echo "::error::Mutation did not run: the tests did not pass (${TESTS})."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install exactly what the lockfile says
        run: uv sync --locked --no-build
      - name: Mutate this shard, and hold its score to the minimum
        env:
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: uv run --locked --no-build --no-sync just mutation-shard "${INDEX}" "${TOTAL}"
      - name: The mutants that survived, each as the change it made
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          survived="$(uv run --locked --no-build --no-sync mutmut results | awk -F: '/: survived$/ { gsub(/^[ \t]+/, "", $1); print $1 }')"
          for mutant in ${survived}; do
            uv run --locked --no-build --no-sync mutmut show "${mutant}"
          done

  # One answer for the whole mutation run: every shard met the minimum.
  mutation:
    name: mutation testing
    needs: mutation-shards
    if: ${{ !cancelled() && needs.mutation-shards.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard met the minimum
        env:
          SHARDS: ${{ needs.mutation-shards.result }}
        run: |
          if [ "${SHARDS}" != success ]; then
            echo "::error::A mutation shard did not meet the minimum or did not finish (${SHARDS})."
            exit 1
          fi

  # The image builds for both platforms the release publishes, runs locked
  # down, read-only, as its own user and with no capability, and answers its
  # own health check and a request without a key. Nothing is pushed: a version
  # tag is the only thing that publishes.
  image:
    name: image
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Builds for both platforms
        run: |
          set -euo pipefail
          docker buildx create --use --name integration-mcp-check
          docker buildx build --platform linux/amd64,linux/arm64 .
          docker buildx build --platform linux/amd64 --load --tag integration-mcp:check .
      - name: Runs locked down, answers its health, and refuses a request without a key
        run: |
          set -euo pipefail
          docker run -d --name integration-mcp-check --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e LEMONFIBER_ADDRESS=http://127.0.0.1:9 -e LEMONFIBER_NAMES=localhost,127.0.0.1 \
            integration-mcp:check
          healthy=false
          for _ in $(seq 1 30); do
            if docker exec integration-mcp-check python -m lemonfiber_mcp health; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "${healthy}" != true ]; then
            docker logs integration-mcp-check
            echo "::error::the image did not answer its own health check"
            exit 1
          fi
          status="$(docker exec integration-mcp-check python -c 'import ssl, urllib.error, urllib.request
          try:
              urllib.request.urlopen("https://127.0.0.1:8443/mcp", context=ssl._create_unverified_context())
          except urllib.error.HTTPError as answered:
              print(answered.code)')"
          if [ "${status}" != 401 ]; then
            docker logs integration-mcp-check
            echo "::error::a request without a key was answered ${status}, not 401"
            exit 1
          fi

  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A job-level block replaces the workflow-level default
  # outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@4562180c9f974bf03aa9be34610f83bb6eb06029 # v1.0.61
