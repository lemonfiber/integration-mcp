# Read by SonarCloud's Automatic Analysis, which scans this tree on every push.

# `tests/` is the suite, named so the rules Sonar scopes to production code stay
# pointed at the server and `scripts/`. A file claimed as both source and test is
# indexed twice and the analysis produces nothing, so `tests/` is also excluded
# from the sources.
sonar.sources=.
sonar.tests=tests
sonar.python.version=3.14

# `src/lemonfiber_mcp/_vendor/**` is sdk-python, copied byte for byte and
# analysed in its own repository; `just vendor-check` fails on any change to it
# here. `src/lemonfiber_mcp/_generated/**` is rewritten whole from the vendored
# contract by `just generate`, and `just generated` fails on any hand edit, so a
# finding there is fixed in `scripts/generate_tools.py`. `contract/` and
# `vendor/` are the vendored artefacts themselves. `scripts/no_open_codeql_alert.py`
# is the spec's shared gate, byte-identical to its home copy and analysed there.
sonar.exclusions=tests/**,src/lemonfiber_mcp/_vendor/**,src/lemonfiber_mcp/_generated/**,contract/**,vendor/**,scripts/no_open_codeql_alert.py
